<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RC Jet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23101619'/%3E%3Cpath d='M4 16 L20 12 L28 16 L20 20 Z' fill='%236E93A8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#1B2226;
    --panel:#C9CEC6;
    --panel-dim:#B4BAB1;
    --ink:#161B1A;
    --ink-soft:#5C645E;
    --rule:#9BA298;
    --focus:#2E6B7A;
    --good:#3E7D52;
    --rail-h:132px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--void); color:var(--panel);
    font-family:Archivo,system-ui,-apple-system,sans-serif; font-size:14px;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  canvas{display:block; touch-action:none}
  #stage{position:fixed; inset:0 0 var(--rail-h) 0}

  #title{position:fixed; top:20px; left:22px; z-index:5; pointer-events:none;
         text-shadow:0 1px 14px rgba(0,0,0,.7)}
  #title h1{margin:0; font-size:20px; font-weight:600; letter-spacing:-.015em}
  #title p{margin:2px 0 0; font-size:12.5px; color:#94A09B}

  #spec{position:fixed; top:20px; right:22px; z-index:5; pointer-events:none;
        text-align:right; display:grid; gap:1px;
        text-shadow:0 1px 14px rgba(0,0,0,.7)}
  #spec div{font-size:12.5px; color:#94A09B; font-variant-numeric:tabular-nums}
  #spec b{color:var(--panel); font-weight:600}

  /* balance is the number that decides whether an aeroplane flies, so it gets
     its own readout rather than being buried in a list */
  #bal{
    position:fixed; left:22px; bottom:calc(var(--rail-h) + 18px); z-index:5;
    pointer-events:none; width:238px;
  }
  #bal .cap{font-size:11px; color:#9AA6A1; margin-bottom:6px}
  #bal .track{position:relative; height:26px; background:#2B3439; border:1px solid #3A454A}
  #bal .band{position:absolute; top:0; bottom:0; background:rgba(62,125,82,.42);
             border-left:1px solid #58A06F; border-right:1px solid #58A06F}
  #bal .cg{position:absolute; top:-4px; bottom:-4px; width:2px; background:#E8B26A}
  #bal .lbl{display:flex; justify-content:space-between; margin-top:5px;
            font-size:10.5px; color:#8C9894; font-variant-numeric:tabular-nums}
  #bal .val{color:#E8B26A; font-weight:600}

  #probe{
    position:fixed; right:22px; bottom:calc(var(--rail-h) + 18px); z-index:5;
    min-width:200px; max-width:min(300px,44vw); padding:10px 12px;
    background:rgba(16,22,25,.88); backdrop-filter:blur(7px);
    border:1px solid #2E393D; border-left:3px solid var(--pa,#6E93A8);
    opacity:0; transition:opacity .12s ease; pointer-events:none;
  }
  #probe.on{opacity:1}
  #probe .nm{font-size:14px; font-weight:600; color:#E6EAE4; word-break:break-word}
  #probe .md{font-size:12px; color:#8C9894; margin-top:1px}
  #probe dl{display:grid; grid-template-columns:auto 1fr; gap:3px 14px; margin:8px 0 0;
            font-size:12px; font-variant-numeric:tabular-nums}
  #probe dt{color:#78847F} #probe dd{margin:0; text-align:right; color:#C9CEC6}

  #rail{
    position:fixed; left:0; right:0; bottom:0; z-index:6; height:var(--rail-h);
    background:var(--panel); color:var(--ink);
    box-shadow:0 -16px 38px rgba(0,0,0,.45);
    display:grid; grid-template-rows:auto auto 1fr;
  }
  #railhead{display:flex; align-items:baseline; justify-content:space-between;
            gap:14px; padding:9px 22px 0}
  #railhead h2{margin:0; font-size:12.5px; font-weight:600}
  #railhead span{font-size:11.5px; color:var(--ink-soft)}

  #groups{display:flex; flex-wrap:wrap; gap:6px; padding:9px 22px 0}
  .grp{
    border:1px solid var(--rule); background:transparent; color:var(--ink);
    font:inherit; font-size:11.5px; font-weight:500; padding:4px 10px;
    cursor:pointer; outline-offset:2px; transition:background .13s ease;
  }
  .grp:hover{background:var(--panel-dim)}
  .grp:focus-visible{outline:2px solid var(--focus)}
  .grp[aria-pressed="false"]{color:#8E958C; border-color:#BEC4BA}
  .grp .sw{display:inline-block; width:8px; height:8px; margin-right:6px;
           background:var(--c); vertical-align:baseline}
  .grp[aria-pressed="false"] .sw{background:#BEC4BA}
  .grp .ct{color:var(--ink-soft); margin-left:5px; font-weight:400}

  #controls{display:flex; align-items:center; gap:14px; flex-wrap:wrap;
            padding:0 22px 11px; margin-top:8px}
  .btn{
    border:1px solid var(--rule); background:transparent; color:var(--ink);
    font:inherit; font-size:11.5px; font-weight:500; padding:4px 11px;
    cursor:pointer; outline-offset:2px;
  }
  .btn:hover{background:var(--panel-dim)}
  .btn:focus-visible{outline:2px solid var(--focus)}
  .btn[aria-pressed="true"]{background:var(--ink); color:var(--panel)}

  #load{position:fixed; inset:0; z-index:9; display:grid; place-content:center;
        gap:12px; background:var(--void); text-align:center; transition:opacity .4s ease}
  #load.done{opacity:0; pointer-events:none}
  #load p{margin:0; font-size:13px; color:#8C9894; font-variant-numeric:tabular-nums}
  #bar{width:200px; height:2px; background:#2A3337; overflow:hidden}
  #bar i{display:block; height:100%; width:0%; background:#6E93A8; transition:width .2s}
  #err{color:#D08A6A; font-size:12.5px; max-width:320px; line-height:1.5}

  @media (max-width:760px){
    :root{--rail-h:168px}
    #title h1{font-size:17px}
    #spec div:nth-child(n+3){display:none}
    #bal{display:none}
    #probe{left:16px; right:16px; max-width:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}

  /* --- wind tunnel ---------------------------------------------------- */
  /* An instrument panel, not a dashboard: the numbers are the content, so
     they get a tabular monospace face and everything else stays quiet. */
  /* Fixed and bounded, not absolute and unbounded. The panel is a column of
     readouts that grows with what the solve has to say, and it used to run
     off the bottom of the window: the how-to-read paragraph and half the
     spanwise load plot were below the fold with no way to reach them. */
  #tunnel{
    position:fixed; left:16px; top:96px; width:302px; z-index:6;
    bottom:calc(var(--rail-h) + 14px); display:none;
    overflow-y:auto; overscroll-behavior:contain;
    scrollbar-width:thin; scrollbar-color:#3C4A52 transparent;
  }
  #tunnel::-webkit-scrollbar{width:8px}
  #tunnel::-webkit-scrollbar-thumb{background:#3C4A52; border-radius:4px}
  #tunnel::-webkit-scrollbar-track{background:transparent}
  #tunnel.on{display:block}
  .twrap{
    background:rgba(16,22,25,.93); border:1px solid #2C383E; border-radius:3px;
    padding:12px 13px 10px;
  }
  .thead{display:flex; justify-content:space-between; align-items:baseline;
         border-bottom:1px solid #2C383E; padding-bottom:7px; margin-bottom:9px}
  .tt{font-weight:600; font-size:13px; letter-spacing:.01em}
  .ts{font-size:11px; color:#6E7D86; font-variant-numeric:tabular-nums}
  .trow{display:grid; grid-template-columns:82px 1fr 54px; align-items:center;
        gap:8px; margin:7px 0}
  .tlab{font-size:11px; color:#96A3AB}
  .trow output{font-size:11px; color:#DCE6EB; text-align:right;
               font-variant-numeric:tabular-nums}
  .trow input[type=range]{
    -webkit-appearance:none; appearance:none; height:2px; background:#36444B;
    border-radius:2px; outline:none;
  }
  .trow input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:#8FB9CE; cursor:grab; border:2px solid #101619;
  }
  .trow input[type=range]::-moz-range-thumb{
    width:13px; height:13px; border-radius:50%; background:#8FB9CE;
    cursor:grab; border:2px solid #101619;
  }
  .trow input[type=range]:focus-visible{outline:2px solid #8FB9CE; outline-offset:3px}
  .treadout{margin-top:11px; border-top:1px solid #2C383E; padding-top:9px}
  .treadout .tr{display:flex; justify-content:space-between; padding:2.5px 0}
  .treadout dt{font-size:11px; color:#96A3AB}
  .treadout dd{font-size:11.5px; margin:0; font-variant-numeric:tabular-nums;
               color:#E6EEF2}
  .tplot{margin-top:10px}
  .tcap{font-size:10px; color:#6E7D86; margin-bottom:3px}
  #t-span{width:100%; height:76px; display:block}
  .tnote{font-size:10.5px; line-height:1.45; color:#7C8A92; margin:9px 0 0}
  .tnote.warn{color:#E0A05A}
  .tstatus{font-size:10.5px; color:#7FB2C9; min-height:13px; margin:-4px 0 6px}
  .tstatus.busy{color:#E0A05A}
  #t-legend{width:100%; height:46px; display:block}
  .tabout{font-size:10.5px; line-height:1.5; color:#8A969D;
          margin:8px 0 0; padding-top:8px; border-top:1px solid #2C383E}


  /* --- throttle --------------------------------------------------------- */
  #thr{display:flex; gap:0; margin-right:8px}
  #thr button{
    font:inherit; font-size:11.5px; padding:5px 10px; cursor:pointer;
    background:var(--panel); color:var(--ink-dim);
    border:1px solid #2C383E; border-right:0;
  }
  #thr button:first-child{border-radius:3px 0 0 3px}
  #thr button:last-child{border-right:1px solid #2C383E; border-radius:0 3px 3px 0}
  #thr button[aria-pressed="true"]{background:#D9E4EA; color:#101619; font-weight:600}
  #thr button:focus-visible{outline:2px solid var(--focus); outline-offset:2px; z-index:1}
  #n1box{font-size:11px; color:#7C8A92; font-variant-numeric:tabular-nums;
         align-self:center; margin-right:10px; min-width:78px}

/* ---- wind tunnel: view switches and the how-to-read line ---- */
#tunnel .tviews{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;
  margin:8px 0 2px;padding-top:8px;border-top:1px solid #1E282D}
#tunnel .tview{display:flex;align-items:center;gap:6px;font-size:11px;
  color:#9FADB5;cursor:pointer;line-height:1.5}
#tunnel .tview input{accent-color:#7FB2C9;width:12px;height:12px;margin:0}
#tunnel .tview:hover{color:#DCE6EB}
#tunnel .thow{margin:6px 0 0;font-size:10.5px;line-height:1.45;color:#6E7C84}
@media (prefers-reduced-motion: reduce){
  #tunnel .tview input#tv-anim{outline:1px dashed #46555E}
}
</style>
</head>
<body>

<div id="stage"></div>

<div id="title">
  <h1>RC Jet</h1>
  <p>Cropped-delta · F110 turbofan at 1:33</p>
</div>

<div id="spec">
  <div><b id="s-dim">—</b> mm</div>
  <div><b id="s-mass">—</b> g all-up</div>
  <div><b id="s-load">—</b> g/dm²</div>
  <div><b id="s-parts">—</b> parts</div>
</div>

<div id="bal">
  <div class="cap">Centre of gravity, % of mean aerodynamic chord</div>
  <div class="track"><div class="band" id="b-band"></div><div class="cg" id="b-cg"></div></div>
  <div class="lbl"><span>0 %</span><span class="val" id="b-val">—</span><span>50 %</span></div>
</div>

<div id="probe" aria-live="polite">
  <div class="nm" id="p-name"></div>
  <div class="md" id="p-grp"></div>
  <dl>
    <dt>Station</dt><dd id="p-sta"></dd>
    <dt>Material</dt><dd id="p-mat"></dd>
  </dl>
</div>

<div id="rail">
  <div id="railhead">
    <h2>Assemblies</h2>
    <span id="note">Click an assembly to hide it. Drag to orbit.</span>
  </div>
  <div id="groups"></div>
  <div id="controls">
    <div id="thr" role="group" aria-label="Throttle">
      <button type="button" data-d="0" aria-pressed="true">Off</button>
      <button type="button" data-d="1" aria-pressed="false">Idle</button>
      <button type="button" data-d="2" aria-pressed="false">Mil</button>
      <button type="button" data-d="3" aria-pressed="false">Max A/B</button>
    </div>
    <span id="n1box">N1 <b id="n1">0</b> %</span>
    <button class="btn" id="gear" type="button" aria-pressed="false">Gear down</button>
    <button class="btn" id="tunnel-btn" type="button" aria-pressed="false">Wind tunnel</button>
    <button class="btn" id="skin" type="button" aria-pressed="false">Show internals</button>
    <button class="btn" id="spin" type="button" aria-pressed="false">Spin</button>
    <button class="btn" id="reset" type="button">Reset view</button>
  </div>
</div>

<div id="tunnel-host"></div>

<div id="load">
  <p id="loadtxt">Loading aircraft…</p>
  <div id="bar"><i></i></div>
  <p id="err"></p>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "animejs":"https://cdn.jsdelivr.net/npm/animejs@4.0.2/+esm",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {tweenNumber, fadeObject, flyCamera, revealPanel, revealRows,
        reducedMotion} from './anim.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {WindTunnel, buildPanel, renderReadout, drawSpanLoad}
  from './tunnel-ui.js';
import {drawLegend, speedColour, pressureColour}
  from './cfd-view.js';

const MM = 0.001;

// Anything inside named(...) is a claim that these are parts or groups in
// viewer/parts.json, and tools/validate_viewer.mjs checks the claim. A
// renamed part must not be able to go on quietly not matching.
const named = (...n) => n;
const matching = (...n) => n;
const $ = s => document.querySelector(s);

// Hiding the skin is how you look inside. No clipping planes: discarding
// fragments turned out to be far more trouble than toggling visibility.
const SKIN = named('fuselage_skin', 'canopy_glass');

// The gear is up unless you ask for it. This aircraft spends its life with
// the wheels retracted, and a model shown sitting on its gear reads as a
// model on a bench rather than an aeroplane.
const GEAR_GROUP = named('06 Landing Gear')[0];

let keyLight = null;   // cast shadows, and sized to the model in ready()
let scene, camera, renderer, controls, root, raycaster, clock;
let data, byGroup = new Map(), info = new Map(), pickable = [];
let hidden = new Set(), hovered = null, corners = [], viewDir, spinning = false;
let tunnel = null, panel = null, byName = new Map(), gearDown = false;
let spoolLP = [], spoolHP = [], plume = null, plumeMat = null, plumeLight = null;
// N1 is a state, not a switch: a turbine takes seconds to spool, and the
// afterburner only lights once the core is already up.
const DETENT = [{n1:0, ab:0}, {n1:0.62, ab:0}, {n1:1.0, ab:0}, {n1:1.0, ab:1}];
let detent = 0, rpm = {n1:0, ab:0};

init();

async function init(){
  const stage = $('#stage');
  renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  // Self-shadowing. Without it every recess is exactly as bright as the
  // surface beside it, which is the difference between an object and a
  // lit diagram.
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);
  clock = new THREE.Clock();

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1B2226);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(studioEnv()).texture;
  scene.environmentIntensity = 1.05;

  camera = new THREE.PerspectiveCamera(30, stage.clientWidth/stage.clientHeight, 0.02, 60);

  // Lit from several directions on purpose: a single key leaves the underside
  // of a fuselage black, and there is nothing to see in a black fuselage.
  scene.add(
    keyLight = dir(0xFFF4E8, 1.45, -2.2, 3.4, 2.6),
    dir(0xC9DCE6, 0.85,  2.6,-1.8,-2.0),
    dir(0xFFFFFF, 0.70,  2.0, 1.6,-2.8),
    new THREE.HemisphereLight(0xE4EDF0, 0x97A0A6, 0.34),
    new THREE.AmbientLight(0xC4CED4, 0.10),
  );

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.075;
  controls.minDistance = 0.20;
  controls.maxDistance = 6;
  raycaster = new THREE.Raycaster();

  try{
    data = await (await fetch('parts.json?nocache=' + Date.now())).json();
  }catch(e){
    return fail('Could not read <code>parts.json</code>. Serve this folder over HTTP: '
              + 'run <code>make viewer</code> from the project root.');
  }
  fillSpec();
  buildRail();

  const draco = new DRACOLoader().setDecoderPath(
    'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/draco/gltf/');
  new GLTFLoader().setDRACOLoader(draco).load('../build/rcjet.glb?nocache=' + Date.now(),
    g => ready(g.scene),
    ev => {
      if(!ev.total) return;
      const p = Math.round(ev.loaded/ev.total*100);
      $('#bar i').style.width = p + '%';
      $('#loadtxt').textContent = `Loading aircraft… ${p}%`;
    },
    // GLTFLoader routes anything thrown inside the success callback here too,
    // so report what actually went wrong rather than always blaming the file.
    e => {
      console.error(e);
      const why = e && e.message ? `<br><small>${e.message}</small>` : '';
      fail('Could not load <code>build/rcjet.glb</code>. Run '
         + `<code>make export</code>.${why}`);
    });
}

function dir(colour, intensity, x, y, z){
  const l = new THREE.DirectionalLight(colour, intensity);
  l.position.set(x, y, z);
  return l;
}

function studioEnv(){
  // A metal only looks like metal when its reflection has CONTRAST: bright
  // sky above, dark floor below, and a couple of distinct softboxes that
  // streak across the surface as it turns. A uniform grey gradient reflects
  // as a uniform grey surface -- which is why the old lightbox read as clay.
  const w = 1024, h = 512;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0.00, '#FDFEFF');
  grad.addColorStop(0.30, '#DDE5EA');
  grad.addColorStop(0.49, '#9AA6AE');
  grad.addColorStop(0.55, '#2A2F33');
  grad.addColorStop(1.00, '#0B0D0E');
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  // two overhead softboxes and one low bounce strip: sharp specular streaks
  for(const [cx, cw, ci] of [[0.22, 0.10, 1.0], [0.62, 0.14, 0.85], [0.88, 0.06, 0.5]]){
    const p = g.createLinearGradient(0, h * 0.03, 0, h * 0.40);
    p.addColorStop(0, `rgba(255,252,246,${0.95 * ci})`);
    p.addColorStop(1, 'rgba(255,252,246,0)');
    g.fillStyle = p;
    g.fillRect(w * (cx - cw / 2), h * 0.03, w * cw, h * 0.37);
  }
  const t = new THREE.CanvasTexture(cv);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function fail(html){
  $('#loadtxt').textContent = 'Nothing to show yet';
  $('#bar').style.display = 'none';
  $('#err').innerHTML = html;
}

function fillSpec(){
  $('#s-dim').textContent = `${Math.round(data.length)} × ${Math.round(data.span)}`;
  $('#s-mass').textContent = Math.round(data.mass_g);
  $('#s-load').textContent = data.wing_loading.toFixed(1);
  $('#s-parts').textContent = Object.keys(data.parts).length;

  const pct = data.cg_frac * 100, lo = (data.cg_target - data.cg_tol) * 100,
        hi = (data.cg_target + data.cg_tol) * 100;
  const toX = v => Math.max(0, Math.min(100, v / 50 * 100));
  $('#b-band').style.left = toX(lo) + '%';
  $('#b-band').style.width = (toX(hi) - toX(lo)) + '%';
  $('#b-cg').style.left = toX(pct) + '%';
  $('#b-val').textContent = pct.toFixed(1) + ' %';
}

function ready(model){
  root = model;
  root.traverse(o => {
    if(!o.isMesh) return;
    const nfo = data.parts[o.name];
    if(!nfo) return;
    o.material = o.material.clone();
    const alloy = data.palette[nfo.mat];
    if(alloy){
      o.material.color.setRGB(...alloy.rgb, THREE.LinearSRGBColorSpace);
      o.material.metalness = alloy.metal;
      o.material.roughness = Math.max(alloy.rough, 0.28);
    }
    // Both sides, always. Booleans and exporters leave the odd face wound the
    // other way, and culling those shows the dark interior through the skin.
    o.material.side = THREE.DoubleSide;
    if(nfo.mat === 'glass'){
      o.material.transparent = true;
      o.material.opacity = 0.30;
      o.material.depthWrite = false;
    }
    info.set(o, nfo);
    byName.set(o.name, o);
    if(nfo.pivot && nfo.pivot.role === 'spool_lp') spoolLP.push({o, s:nfo.pivot.spin});
    if(nfo.pivot && nfo.pivot.role === 'spool_hp') spoolHP.push({o, s:nfo.pivot.spin});
    pickable.push(o);
    if(!byGroup.has(nfo.g)) byGroup.set(nfo.g, []);
    byGroup.get(nfo.g).push(o);
  });

  const box = new THREE.Box3().setFromObject(root);
  root.position.sub(box.getCenter(new THREE.Vector3()));
  scene.add(root);

  const size = box.getSize(new THREE.Vector3());


  /* Shadows, and something for them to land on. A transparent catcher takes

     the ground shadow without putting a visible floor slab in the picture. */

  if(keyLight){

    keyLight.castShadow = true;

    keyLight.shadow.mapSize.set(2048, 2048);

    keyLight.shadow.bias = -0.0006;

    keyLight.shadow.normalBias = 0.012;

    const span = Math.max(size.x, size.y, size.z);

    const sc = keyLight.shadow.camera;

    sc.left = -span * 0.62; sc.right = span * 0.62;

    sc.top = span * 0.62; sc.bottom = -span * 0.62;

    sc.near = 0.05; sc.far = span * 6.0;

    sc.updateProjectionMatrix();

    root.traverse(o => { if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });

    const catcher = new THREE.Mesh(

      new THREE.PlaneGeometry(span * 4, span * 4),

      new THREE.ShadowMaterial({opacity: 0.32}));

    catcher.rotation.x = -Math.PI / 2;

    catcher.position.y = -size.y * 0.60;

    catcher.receiveShadow = true;

    scene.add(catcher);

  }
  corners = [];
  for(const sx of [-.5,.5]) for(const sy of [-.5,.5]) for(const sz of [-.5,.5])
    corners.push(new THREE.Vector3(size.x*sx, size.y*sy, size.z*sz));
  viewDir = new THREE.Vector3(0.46, -0.34, -0.82).normalize();
  resetView();

  addEventListener('resize', onResize);
  renderer.domElement.addEventListener('pointermove', onMove);
  renderer.domElement.addEventListener('pointerleave', () => setProbe(null));
  buildPlume();
  buildTunnel(box);
  setGear(false);
  window.__dbg = {scene, camera, renderer, root, byGroup, tunnel, controls};
  $('#load').classList.add('done');
  renderer.setAnimationLoop(tick);
}

function fitDistance(dirv, margin = 1.03){
  const up = new THREE.Vector3(0,1,0);
  const right = new THREE.Vector3().crossVectors(dirv, up).normalize();
  const camUp = new THREE.Vector3().crossVectors(right, dirv).normalize();
  const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov)/2);
  const th = tv * camera.aspect;
  let d = 0;
  for(const c of corners){
    const depth = c.dot(dirv);
    d = Math.max(d, Math.abs(c.dot(right))/th - depth,
                    Math.abs(c.dot(camUp))/tv - depth);
  }
  return d * margin;
}

function resetView(){
  controls.target.set(0,0,0);
  camera.position.copy(viewDir).multiplyScalar(-fitDistance(viewDir));
  camera.lookAt(0,0,0);
  controls.update();
}

function onResize(){
  const s = $('#stage');
  camera.aspect = s.clientWidth/s.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(s.clientWidth, s.clientHeight);
}

/* The afterburner. A cone of additively blended shells behind the tailpipe,
 * shaded from a white-hot shock core through amber and orange-red to a blue
 * tail -- the same ramp the F110 viewer uses, scaled to the airframe. Shock
 * diamonds are the standing wave pattern in the supersonic exhaust. */
function plumeShell(rScale, lScale, gain, seed){
  const pts = [];
  for(let i = 0; i <= 46; i++){
    const t = i/46;
    const neck = 1 - 0.22*Math.exp(-Math.pow((t-0.12)/0.09, 2));
    const r = (0.030 + 0.330*Math.pow(1-t, 1.45)) * neck * rScale;
    pts.push(new THREE.Vector2(Math.max(r, 0.0004), t*4.2*lScale));
  }
  const geo = new THREE.LatheGeometry(pts, 40);
  geo.rotateZ(-Math.PI/2);
  const mat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    side:THREE.DoubleSide,
    uniforms:{
      uTime:{value:0}, uAb:{value:0}, uGain:{value:gain}, uSeed:{value:seed},
      uCore:{value:new THREE.Color(0xFFF7E6)},
      uMid:{value:new THREE.Color(0xFFB347)},
      uHot:{value:new THREE.Color(0xFF5A1F)},
      uTail:{value:new THREE.Color(0x4A6CF7)},
    },
    vertexShader:`
      varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      void main(){
        vUv = uv;
        vN = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position,1.0);
        vV = -mv.xyz;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader:`
      uniform float uTime, uAb, uGain, uSeed;
      uniform vec3 uCore, uMid, uHot, uTail;
      varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      void main(){
        float t = vUv.y;
        float reach = mix(0.22, 1.0, uAb);
        float env = smoothstep(0.0, 0.015, t) * pow(max(0.0, 1.0 - t/reach), 1.8);
        float d = pow(max(0.0, sin(t*26.0 - uTime*1.5 + uSeed)), 6.0)
                * smoothstep(0.68, 0.05, t);
        float flick = 0.92 + 0.08*sin(uTime*31.0 + t*19.0 + uSeed);
        float edge = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 1.5);
        float a = env * (0.30 + 0.70*edge) * (0.55 + 0.75*d) * flick * uAb * uGain;
        vec3 col = mix(uCore, uMid, smoothstep(0.02, 0.30, t));
        col = mix(col, uHot, smoothstep(0.22, 0.58, t));
        col = mix(col, uTail, smoothstep(0.55, 1.0, t));
        col = mix(col, vec3(1.0, 0.95, 0.85), clamp(d*0.8, 0.0, 1.0));
        gl_FragColor = vec4(col, clamp(a, 0.0, 1.0));
      }`,
  });
  const m = new THREE.Mesh(geo, mat);
  m.raycast = () => {};
  return {mesh:m, mat};
}

function buildPlume(){
  const tp = byName.get('tailpipe_shroud');
  if(!tp) return;
  const b = new THREE.Box3().setFromObject(tp);
  const r = Math.max((b.max.y - b.min.y), (b.max.z - b.min.z)) * 0.5;
  plume = new THREE.Group();
  plumeMat = [];
  for(const [rs, ls, g, sd] of [[1.00, 1.00, 1.00, 0.0],
                                [0.62, 0.78, 0.85, 2.1],
                                [1.35, 1.22, 0.34, 4.3]]){
    const sh = plumeShell(rs, ls, g, sd);
    plumeMat.push(sh.mat);
    plume.add(sh.mesh);
  }
  // the shells are authored for a 0.36 m radius engine; scale once to fit
  plume.scale.setScalar(r / 0.36);
  plume.position.set(b.max.x, (b.max.y+b.min.y)/2, (b.max.z+b.min.z)/2);
  plume.visible = false;
  root.add(plume);

  plumeLight = new THREE.PointLight(0xFF8A44, 0, 0.9, 2);
  plumeLight.position.set(b.max.x + r*6, (b.max.y+b.min.y)/2,
                          (b.max.z+b.min.z)/2);
  root.add(plumeLight);
}

function setDetent(i){
  detent = i;
  for(const b of document.querySelectorAll('#thr button'))
    b.setAttribute('aria-pressed', String(+b.dataset.d === i));
  // the engine's appetite is part of the flow field: move the throttle and
  // the tunnel re-ingests. Ports are read at the commanded detent, not the
  // ramping N1, so the picture settles with the lever, not three seconds late.
  if(tunnel && tunnel.state.on) tunnel.retraceProgressive();
}

/* Flow ports in the solver frame (x aft from the nose, y span, z up, metres).
 * The belly intake swallows what the engine eats; the tailpipe puts the
 * exhaust momentum back into the air behind the model. Strength tracks the
 * detent -- at idle the engine barely disturbs the tunnel, at Max A/B the
 * streamlines visibly accelerate out of the tail. */
function flowPorts(state){
  const want = DETENT[detent];
  const n1 = want.n1, ab = want.ab;
  /* Mass flow does NOT scale with airspeed.
   *
   * It used to, "so the intake capture ratio does not vanish when the wind
   * comes up" -- which is a reason about the picture, and the picture it was
   * protecting was the wrong one. A turbofan at a fixed N1 passes very nearly
   * a constant mass flow: the fan sets it, not the flight speed. Two real
   * behaviours follow, and scaling Q with V hid both.
   *
   * Thrust FALLS with speed. T = mdot(Ve - V0) with mdot and Ve fixed by the
   * engine, so every knot of airspeed is a knot of ram drag. Scaled with V it
   * came out rising as V squared, which is not a jet -- it is a windmill.
   *
   * The capture ratio falls with speed too, and that is the thing worth
   * looking at. At 22 m/s this engine wants 37 m/s through a mouth the air
   * arrives at at 22, so the streamtube ahead of it is WIDER than the intake
   * and you can see it being gathered in. At 45 it is narrower than the
   * intake and the excess spills round the lip. That change is what an intake
   * does, and holding it constant was hiding it.
   */
  const v = 1;
  /* Sized from THRUST, not from taste.
   *
   * It used to be 0.012 + 0.075.n1, which through this nozzle's 7.6 cm2 at
   * the old expansion ratio came out at 332 m/s -- Mach 0.97 out of the back
   * of a 440 mm model -- and implied several kilogrammes of thrust on a 564 g
   * aeroplane. Solving T = rho.Q.(Q.expand/Ae - V0) for the thrust a model
   * this size actually makes, about 0.7 of its weight dry:
   *
   *     Q = 0.0416 m3/s   face 37 m/s (1.7 x flight speed, so the capture
   *                       tube is wider than the mouth, which is what a jet
   *                       at low speed and high power looks like)
   *     Ve = 99 m/s dry, 175 m/s reheated
   *     T  = 3.9 N dry (0.71 W), 7.8 N reheated (1.4 W)
   */
  const q = (0.006 + n1*0.0356) * v;
  /* Volume flux, not mass flux. The solve is incompressible, so the tailpipe
   * has to pass the same mass through a much lower density: core gas leaves
   * near 900 K dry and 1900 K reheated against 288 K ambient, so the volume
   * going out is a few times the volume coming in. That ratio is the reason
   * the flow behind the tail accelerates, and getting it from the temperature
   * rather than from taste also closes the mass budget -- the intake sink and
   * the tailpipe source now describe one engine instead of two unrelated
   * monopoles leaving a net source in the far field. */
  const expand = 1.8 + 1.4*ab;
  return [
    {p: [0.058, 0.0, -0.017], Q: -q,        r: 0.020},  // intake lip
    {p: [0.444, 0.0,  0.000], Q:  q*expand, r: 0.016},  // tailpipe
  ];
}

function buildTunnel(box){
  if(!data.tunnel) return;
  // the panel first: the tunnel solves once on construction and writes its
  // first readout straight into this DOM
  panel = buildPanel($('#tunnel-host'), data.tunnel,
                     (id, v) => tunnel.set(id, v),
                     () => retrace());
  tunnel = new WindTunnel({
    cfg: data.tunnel, scene, root, parts: byName, manifest: data.parts,
    bounds: box.clone().translate(root.position),
    panelBody: data.panel_body,
    nLines: 300,
    ports: (state) => flowPorts(state),
    onSolve: r => {
      renderReadout($('#t-readout'), r, data.tunnel, 'plane');
      drawSpanLoad($('#t-span'), r.strips);
      $('#t-panels').textContent = `${r.panels} panels · ${r.v.toFixed(0)} m/s`;
      const n = $('#t-note');
      const vor = data.tunnel.vortex_alpha || 99;
      if(r.stalled){
        n.className = 'tnote warn';
        n.textContent = `Past ${r.stall_alpha}° the vortices break down before `
          + 'the trailing edge and the wing loses them. Nothing here models '
          + 'that, so the lift above this angle is lift the aircraft would '
          + 'not make.';
      }else if(r.alpha >= vor){
        n.className = 'tnote';
        n.textContent = `Past about ${vor}° the leading edge has let go: `
          + `${((1-r.suctionKept)*100).toFixed(0)}% of its suction is gone and `
          + 'the wing is flying on the vortices that separation rolls up. That '
          + 'is what a delta does, and it costs drag — the resultant force is '
          + 'no longer tilted forward by leading-edge suction.';
      }else{
        n.className = 'tnote';
        n.textContent = 'Source and doublet panels on one closed surface, with '
          + 'a shed wake and a Kutta condition — the lift, the pressures and '
          + 'the streamlines are one solution. Beside it: skin friction and '
          + 'form drag per component at each part\'s own Reynolds number, a '
          + 'laminar separation bubble term (this aeroplane cruises at Re '
          + '262,000, where the bubble is over half the profile drag), base '
          + 'drag, and the leading-edge suction a real boundary layer loses. '
          + 'No stall, and the wake is straight rather than rolled up.';
      }
      $('#t-about').textContent = ABOUT;
    },
  });
  panel.sync(tunnel.state);
}

const ABOUT =
  'A 440 mm cropped-delta jet around an F110 scaled to 1:33. The delta is '
  + 'for roll rate and for a wing that keeps flying at high incidence; the '
  + 'stabilators are all-moving because a delta has no room for an elevator '
  + 'and needs the pitch authority. It sits at 13 % static margin — stable '
  + 'enough to fly hands-off, loose enough to be quick in pitch. The tail is '
  + 'where it is because the solver put it there: the first position sat in '
  + 'the wing wake and left almost no margin at all.';

// --- flow view switches (injected) ---

/* The legend follows whatever is on screen.
 *
 * One fixed velocity bar used to be drawn whatever you were looking at, which
 * meant that with surface pressure up the colours on the model had no key at
 * all. Speed gets a Turbo bar with freestream marked; pressure gets a
 * diverging bar with Cp = 0 marked, because those are the two reference values
 * a reader needs to turn a colour back into a number.
 */
function paintLegend(r){
  const cv = $('#t-legend');
  if(!cv || !r) return;
  const showCp = panel && panel.views && panel.views.surface;
  if(showCp){
    const cr = tunnel.cpRange() || {lo: -2, hi: 1};
    /* Label the scale that is drawn, not the extremes that were found.
     *
     * The first version printed the observed range, which on the car reads
     * "Cp -12.49 to 1.00" -- a number set by a single panel sitting on a
     * point-source singularity, on a bar that actually runs to -1.45. A
     * legend has one job and that is to let a colour be read back as a
     * number; labelling it with a range it does not cover fails that job
     * completely. */
    panel.setLegendCaption(
      `Surface pressure · C\u209A ${cr.lo.toFixed(2)} to ${cr.hi.toFixed(2)}`);
    drawLegend(cv, cr.lo, cr.hi, 'C\u209A [-]',
               {map: pressureColour, zeroAt: 0});
    panel.setHow('Blue is below ambient: suction, which is what lifts the '
               + 'aircraft. Red is stagnation, where the air has been brought '
               + 'to rest against a surface.');
  } else {
    panel.setLegendCaption('Local air speed');
    drawLegend(cv, r.vmin, r.vmax, 'Velocity [m/s]',
               {map: speedColour, ref: r.vfs, refLabel: 'V\u221E'});
    panel.setHow('Colour is speed; the mark is the airspeed itself, so '
               + 'anything left of it has been slowed and anything right of '
               + 'it accelerated. The pulses travel at the local speed.');
  }
}

/* Every mesh the pressure map can be painted onto. */
function flowMeshes(){
  const out = [];
  if(root) root.traverse(o => { if(o.isMesh && o.visible !== false) out.push(o); });
  return out;
}

/* Hand the flow view the geometry it paints on, and connect the switches. */
function wireFlowViews(){
  if(!tunnel || !panel || !panel.onView) return;
  tunnel.setMeshes(flowMeshes());
  panel.onView((id, on) => {
    tunnel.setLayer(id, on);
    if(id === 'surface' || id === 'plane'){
      const r = tunnel.lastResult;
      if(r) paintLegend(r);
    }
  });
}

function retrace(){
  if(!tunnel || !tunnel.state.on) return;
  const st = $('#t-status');
  st.className = 'tstatus busy';
  st.textContent = 'Tracing streamlines…';
  /* Trace in slices, drawing as the lines arrive.
   *
   * This used to be one blocking call behind two requestAnimationFrames whose
   * only job was to get the "tracing..." message painted before the tab froze
   * for several seconds. The work is the same; it is spread over frames now,
   * so the model can still be orbited while the flow fills in and the progress
   * is a count rather than a spinner. */
  tunnel.retraceProgressive((done, total) => {
    st.textContent = `Tracing streamlines… ${done} of ${total}`;
  }).then(r => {
    if(r){
      tunnel.lastResult = r;
      paintLegend(r);
      st.className = 'tstatus';
      // where the time actually went, rather than a guess in a comment
      const T = r.timing || {};
      const ph = ['solve','trace','cp','ribbons','arrows']
        .filter(k => T[k] > 4)
        .map(k => `${k} ${T[k].toFixed(0)}`).join(' · ');
      st.title = ph;
      st.textContent = `${r.lines} streamlines · ${r.ms.toFixed(0)} ms · `
                     + `${data.panel_body.n} surface panels`;
    }
  });
}

function setGear(on){
  gearDown = on;
  for(const o of (byGroup.get(GEAR_GROUP) || [])) o.visible = on;
  const b = $('#gear');
  if(b){
    b.setAttribute('aria-pressed', String(on));
    b.textContent = on ? 'Gear up' : 'Gear down';
  }
}

function setTunnel(on){
  if(!tunnel) return;
  $('#tunnel').classList.toggle('on', on);
  $('#tunnel-btn').setAttribute('aria-pressed', String(on));
  tunnel.setOn(on);
  if(on){
    panel.sync(tunnel.state);
    wireFlowViews();
    // one orchestrated entrance, not a transition on every element
    revealPanel(panel.el.querySelector('.twrap'));
    retrace();
    spinning = false;
    $('#spin').setAttribute('aria-pressed','false');
  }
}

function tick(){
  const dt = Math.min(clock.getDelta(), 0.05);

  // spool lag: N1 chases the detent, and the augmenter only lights behind it
  const want = DETENT[detent];
  rpm.n1 += (want.n1 - rpm.n1) * Math.min(1, dt * (want.n1 > rpm.n1 ? 0.9 : 1.6));
  rpm.ab += (want.ab * (rpm.n1 > 0.93 ? 1 : 0) - rpm.ab) * Math.min(1, dt * 2.4);
  if(spoolLP.length){
    for(const s2 of spoolLP) s2.o.rotation.x += dt * rpm.n1 * 16.0 * s2.s;
    for(const s2 of spoolHP) s2.o.rotation.x += dt * rpm.n1 * 16.0 * s2.s;
  }
  if(plume){
    plume.visible = rpm.ab > 0.004;
    for(const m of plumeMat){ m.uniforms.uTime.value += dt; m.uniforms.uAb.value = rpm.ab; }
    plumeLight.intensity = rpm.ab * 12.0;
  }
  $('#n1').textContent = Math.round(rpm.n1 * 100);

  // the travelling pulse on the streamlines runs off this clock, so
  // the flow keeps moving without retracing anything
  if(tunnel) tunnel.update(dt);
  if(spinning && root) root.rotation.y += dt * 0.35;
  controls.update();
  renderer.render(scene, camera);
}

const ndc = new THREE.Vector2();
function onMove(e){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX-r.left)/r.width)*2 - 1;
  ndc.y = -((e.clientY-r.top)/r.height)*2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(pickable.filter(o => o.visible), false)[0];
  setProbe(hit ? hit.object : null);
}

function setProbe(mesh){
  if(mesh === hovered) return;
  if(hovered && hovered.material.emissive) hovered.material.emissive.setHex(0x000000);
  hovered = mesh;
  const box = $('#probe');
  if(!mesh){ box.classList.remove('on'); return; }
  const nfo = info.get(mesh);
  const grp = data.groups.find(g => g.key === nfo.g);
  if(mesh.material.emissive) mesh.material.emissive.setHex(0x16333c);
  $('#p-name').textContent = pretty(mesh.name);
  $('#p-grp').textContent = grp ? grp.label : nfo.g;
  $('#p-sta').textContent = `${Math.round(nfo.x0)} – ${Math.round(nfo.x1)} mm`;
  $('#p-mat').textContent = nfo.mat.replace(/_/g,' ');
  box.style.setProperty('--pa', grp ? grp.color : '#6E93A8');
  box.classList.add('on');
}

function pretty(n){
  return n.replace(/^engine_/,'engine · ').replace(/_/g,' ')
          .replace(/\bl\b/,'left').replace(/\br\b/,'right')
          .replace(/\blipo\b/,'LiPo').replace(/\besc\b/,'ESC')
          .replace(/\bbhd\b/,'bulkhead').replace(/\bhpc\b/g,'HPC')
          .replace(/\bhpt\b/g,'HPT').replace(/\blpt\b/g,'LPT')
          .replace(/^./, c => c.toUpperCase());
}

function buildRail(){
  const box = $('#groups');
  for(const g of data.groups){
    const el = document.createElement('button');
    el.className = 'grp';
    el.type = 'button';
    el.dataset.key = g.key;
    el.style.setProperty('--c', g.color);
    el.setAttribute('aria-pressed','true');
    el.innerHTML = `<span class="sw"></span>${g.label}<span class="ct">${g.parts}</span>`;
    el.title = `${g.label} — ${g.parts} parts, station ${Math.round(g.x0)}–${Math.round(g.x1)} mm`;
    el.addEventListener('click', () => {
      const on = hidden.has(g.key);
      on ? hidden.delete(g.key) : hidden.add(g.key);
      el.setAttribute('aria-pressed', String(on));
      (byGroup.get(g.key)||[]).forEach(o => o.visible = on);
      if(hovered && !hovered.visible) setProbe(null);
    });
    box.appendChild(el);
  }

  for(const b of document.querySelectorAll('#thr button'))
    b.addEventListener('click', () => setDetent(+b.dataset.d));

  $('#gear').addEventListener('click', () => setGear(!gearDown));

  $('#tunnel-btn').addEventListener('click', () => {
    setTunnel($('#tunnel-btn').getAttribute('aria-pressed') !== 'true');
  });

  $('#skin').addEventListener('click', () => {
    const b = $('#skin');
    const showing = b.getAttribute('aria-pressed') === 'true';
    b.setAttribute('aria-pressed', String(!showing));
    b.textContent = showing ? 'Show internals' : 'Hide internals';
    for(const o of pickable){
      if(SKIN.includes(o.name)) o.visible = showing;
    }
    $('#note').textContent = showing
      ? 'Click an assembly to hide it. Drag to orbit.'
      : 'Skin off — bulkheads, battery, servos, spar and engine visible.';
  });

  $('#spin').addEventListener('click', () => {
    spinning = !spinning;
    $('#spin').setAttribute('aria-pressed', String(spinning));
  });

  $('#reset').addEventListener('click', () => {
    if(tunnel && tunnel.state.on){ panel.reset(); }
    resetView();
    if(root) root.rotation.y = 0;
    spinning = false;
    $('#spin').setAttribute('aria-pressed','false');
    hidden.clear();
    for(const list of byGroup.values()) list.forEach(o => o.visible = true);
    for(const el of document.querySelectorAll('.grp')) el.setAttribute('aria-pressed','true');
    const b = $('#skin');
    b.setAttribute('aria-pressed','false');
    b.textContent = 'Show internals';
  });
}
